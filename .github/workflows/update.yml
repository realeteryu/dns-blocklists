name: Update domain blocklist

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dns-blocklist-update
  cancel-in-progress: false

jobs:
  update:
    name: Build DNS blocklist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Generate or update uv.lock
        run: uv lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build blocklist
        run: uv run python scripts/build.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add uv.lock output/blocklist.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update DNS blocklist"
            git push
          fi
