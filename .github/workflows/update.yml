name: Build DNS Blocklist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: build-blocklist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v5

      - name: Instalacja msgpack
        run: pip install msgpack

      - name: Pobieranie i agregacja list
        run: bash scripts/download_sources.sh

      - name: Budowanie listy
        run: python3 scripts/build_blocklist.py

      - name: Walidacja
        run: |
          if [ ! -s output/doh_combined.txt ] || [ ! -s output/doh_combined.msgpack ]; then
            echo "BŁĄD: Jeden z plików wynikowych jest pusty!"
            exit 1
          fi

          DOMAIN_COUNT=$(wc -l < output/doh_combined.txt)
          echo "Gotowe! Końcowa liczba domen: $DOMAIN_COUNT"

          if [ "$DOMAIN_COUNT" -lt 10000 ]; then
            echo "BŁĄD: Podejrzanie mało wpisów ($DOMAIN_COUNT). Przerywam."
            exit 1
          fi

      - name: Commit i push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/doh_combined.txt output/doh_combined.msgpack allowlist.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update and optimize blocklist [skip ci]" && git push)

      - name: Upload do KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key put --namespace-id="${{ secrets.CF_KV_NAMESPACE_ID }}" "blocklist" --path=output/doh_combined.txt --remote
          npx wrangler kv key put --namespace-id="${{ secrets.CF_KV_NAMESPACE_ID }}" "blocklist_bin" --path=output/doh_combined.msgpack --remote
