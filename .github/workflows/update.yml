name: Build DNS Blocklist

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: build-blocklist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v5

      - name: Instalacja msgpack
        run: python3 -m pip install msgpack

      - name: Pobieranie i agregacja list
        run: bash scripts/download_sources.sh

      - name: Budowanie list
        run: python3 scripts/build_blocklist.py

      - name: Walidacja wyników
        run: |
          for FILE in \
            output/doh_combined.txt \
            output/doh_combined.msgpack \
            output/doh_allowlist.msgpack
          do
            if [ ! -s "$FILE" ]; then
              echo "BŁĄD: Brak pliku lub pusty plik: $FILE"
              exit 1
            fi
          done

          DOMAIN_COUNT=$(wc -l < output/doh_combined.txt)
          echo "Liczba domen blokowanych: $DOMAIN_COUNT"

          if [ "$DOMAIN_COUNT" -lt 10000 ]; then
            echo "BŁĄD: Podejrzanie mało wpisów ($DOMAIN_COUNT)."
            exit 1
          fi

          echo "Walidacja plików zakończona pomyślnie."

      - name: Commit i push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            output/doh_combined.txt \
            output/doh_combined.msgpack \
            output/doh_allowlist.msgpack \
            allowlist.txt

          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "feature(aktualizacja): automatyczna aktualizacja list DNS [skip ci]"
            git push
          else
            echo "Brak zmian w plikach wynikowych."
          fi

      - name: Upload bloklisty do Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key put \
            --namespace-id="${{ secrets.CF_KV_NAMESPACE_ID }}" \
            "blocklist_bin" \
            --path=output/doh_combined.msgpack \
            --remote

      - name: Upload allowlisty do Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key put \
            --namespace-id="${{ secrets.CF_KV_NAMESPACE_ID }}" \
            "allowlist_bin" \
            --path=output/doh_allowlist.msgpack \
            --remote
